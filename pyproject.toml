[tool.poetry]
name = "threat-hunting-platform"
version = "0.1.0"
description = "Enterprise-ready threat hunting collection platform with clean architecture."
authors = ["Threat Hunting Team <threat-hunting@example.com>"]
readme = "README.md"
packages = [{ include = "threat_hunting" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.8.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.2"
httpx = "^0.27.2"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"
pymisp = "^2.4.185"
redis = "^5.0.8"
apscheduler = "^3.10.4"
structlog = "^24.4.0"
pyyaml = "^6.0.2"
typer = "^0.12.5"
dependency-injector = "^4.41.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
ruff = "^0.6.7"
mypy = "^1.11.2"

[tool.poetry.scripts]
hunt = "threat_hunting.cli.main:main"

[tool.pytest.ini_options]
addopts = "-q --cov=threat_hunting --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["database/alembic"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
