[tool.poetry]
name = "threat-hunting"
version = "0.1.0"
description = "Enterprise Threat Hunting Collection & Cyber Threat Intelligence platform"
authors = ["CTI Platform Team <cti@example.com>"]
license = "GPL-3.0-only"
readme = "README.md"
packages = [{ include = "threat_hunting" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.7"
pydantic-settings = "^2.3"
"SQLAlchemy" = { version = "^2.0", extras = ["asyncio"] }
alembic = "^1.13"
httpx = { version = "^0.27", extras = ["socks", "http2"] }
beautifulsoup4 = "^4.12"
lxml = "^5.2"
pymisp = "^2.4"
redis = "^5.0"
apscheduler = "^3.10"
structlog = "^24.1"
"PyYAML" = "^6.0"
typer = { version = "^0.12", extras = ["all"] }
"dependency-injector" = "^4.41"
"opentelemetry-api" = "^1.25"
"opentelemetry-sdk" = "^1.25"
prometheus-client = "^0.20"
rich = "^13.7"
aiofiles = "^23.2"
python-dateutil = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
ruff = "^0.4"
mypy = "^1.10"
respx = "^0.21"

[tool.poetry.scripts]
hunt = "threat_hunting.cli.app:app"

[build-system]
requires = ["poetry-core>=1.5"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=threat_hunting --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
