[tool.poetry]
name = "phishing-intel"
version = "0.1.0"
description = "Professional CTI platform for phishing campaign analysis, correlation, enrichment, and attribution."
authors = ["CTI Engineering <cti@example.local>"]
readme = "README.md"
packages = [{ include = "phishing_intel" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "^2.11.7"
sqlalchemy = "^2.0.41"
alembic = "^1.16.4"
pymisp = "^2.5.16"
requests = "^2.32.4"
beautifulsoup4 = "^4.13.4"
lxml = "^6.0.0"
cryptography = "^45.0.5"
dnspython = "^2.7.0"
ipwhois = "^1.3.0"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=phishing_intel --cov-report=term-missing --cov-fail-under=80"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
