[tool.poetry]
name = "phishing-intel"
version = "1.0.0"
description = "Professional Threat Intelligence platform for phishing campaign analysis"
authors = ["CTI Team <cti@example.com>"]
readme = "phishing_intel/README.md"
packages = [{include = "phishing_intel"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.10.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
pymisp = "^2.5.0"
requests = "^2.32.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.3.0"
cryptography = "^44.0.0"
dnspython = "^2.7.0"
ipwhois = "^1.3.0"
pyyaml = "^6.0.2"
structlog = "^24.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
responses = "^0.25.0"

[tool.poetry.scripts]
phishing-intel = "phishing_intel.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["phishing_intel/tests"]
pythonpath = ["."]
addopts = "-v --cov=phishing_intel --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["phishing_intel"]
omit = ["phishing_intel/tests/*", "phishing_intel/database/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
