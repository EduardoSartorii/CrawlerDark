[tool.poetry]
name = "threat-hunting-platform"
version = "0.1.0"
description = "Modular, production-grade Threat Hunting / CTI collection platform (Clean Architecture + Hexagonal + DDD)."
authors = ["Threat Hunting Platform Team"]
readme = "README_PLATFORM.md"
license = "GPL-3.0-or-later"
packages = [{ include = "threat_hunting" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.7"
structlog = "^24.1"
typer = "^0.12"
httpx = "^0.27"
beautifulsoup4 = "^4.12"
lxml = "^5.2"
PyYAML = "^6.0"
prometheus-client = "^0.20"

# Optional adapters. The core runs without any of these installed; the
# infrastructure layer degrades gracefully when they are absent.
SQLAlchemy = { version = "^2.0", optional = true }
alembic = { version = "^1.13", optional = true }
redis = { version = "^5.0", optional = true }
APScheduler = { version = "^3.10", optional = true }
PyMISP = { version = "^2.4", optional = true }
"dependency-injector" = { version = "^4.41", optional = true }
opentelemetry-api = { version = "^1.25", optional = true }
opentelemetry-sdk = { version = "^1.25", optional = true }

[tool.poetry.extras]
sql = ["SQLAlchemy", "alembic"]
redis = ["redis"]
scheduler = ["APScheduler"]
misp = ["PyMISP"]
di = ["dependency-injector"]
otel = ["opentelemetry-api", "opentelemetry-sdk"]
full = [
    "SQLAlchemy", "alembic", "redis", "APScheduler",
    "PyMISP", "dependency-injector",
    "opentelemetry-api", "opentelemetry-sdk",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"

[tool.poetry.scripts]
hunt = "threat_hunting.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["threat_hunting"]
omit = ["threat_hunting/cli/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
