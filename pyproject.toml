[tool.poetry]
name = "threat-hunting"
version = "1.0.0"
description = "Corporate Threat Hunting & Cyber Threat Intelligence Platform"
authors = ["CTI Platform Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "threat_hunting"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = {version = "^2.7", extras = ["email"]}
pydantic-settings = "^2.3"
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
alembic = "^1.13"
httpx = {version = "^0.27", extras = ["http2"]}
beautifulsoup4 = "^4.12"
lxml = "^5.2"
redis = {version = "^5.0", extras = ["hiredis"]}
apscheduler = "^3.10"
structlog = "^24.2"
pyyaml = "^6.0"
typer = {version = "^0.12", extras = ["all"]}
dependency-injector = "^4.41"
opentelemetry-api = "^1.25"
opentelemetry-sdk = "^1.25"
opentelemetry-exporter-otlp = "^1.25"
opentelemetry-instrumentation-httpx = "^0.46b0"
opentelemetry-instrumentation-sqlalchemy = "^0.46b0"
prometheus-client = "^0.21"
pymisp = "^2.4"
aiofiles = "^24.1"
aiosqlite = "^0.20"
asyncpg = "^0.29"
ujson = "^5.10"
python-dateutil = "^2.9"
arrow = "^1.3"
tenacity = "^9.0"
stix2 = "^3.0"
taxii2-client = "^2.3"
yara-python = "^4.5"
python-levenshtein = "^0.25"
rapidfuzz = "^3.9"
tldextract = "^5.1"
validators = "^0.34"
cryptography = "^43.0"
passlib = {version = "^1.7", extras = ["bcrypt"]}
python-jose = {version = "^3.3", extras = ["cryptography"]}
rich = "^13.7"
click = "^8.1"
jinja2 = "^3.1"
aiohttp = "^3.10"
socksio = "^1.0"
stem = "^1.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
factory-boy = "^3.3"
faker = "^26.0"
freezegun = "^1.5"
respx = "^0.21"
anyio = {version = "^4.4", extras = ["trio"]}
mypy = "^1.11"
ruff = "^0.5"
black = "^24.4"
isort = "^5.13"
pre-commit = "^3.7"
coverage = {version = "^7.6", extras = ["toml"]}

[tool.poetry.scripts]
hunt = "threat_hunting.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["threat_hunting/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=threat_hunting --cov-report=term-missing"

[tool.coverage.run]
source = ["threat_hunting"]
omit = ["*/tests/*", "*/migrations/*", "*/alembic/*"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "C4", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
