[tool.poetry]
name = "threat-hunting-collection"
version = "0.1.0"
description = "Enterprise Threat Hunting Collection platform for OSINT, CTI, leak monitoring, correlation and export."
authors = ["Cursor Cloud Agent <agent@cursor.local>"]
license = "GPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "threat_hunting" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic = "^2.0"
sqlalchemy = "^2.0"
alembic = "^1.0"
httpx = "^0.27"
beautifulsoup4 = "^4.12"
lxml = "^5.0"
pymisp = "^2.4"
redis = "^5.0"
apscheduler = "^3.10"
structlog = "^24.0"
pyyaml = "^6.0"
typer = "^0.12"
dependency-injector = "^4.41"
opentelemetry-api = "^1.25"
opentelemetry-sdk = "^1.25"
prometheus-client = "^0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"

[tool.poetry.scripts]
hunt = "threat_hunting.cli.main:app"

[tool.pytest.ini_options]
addopts = "--cov=threat_hunting --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["threat_hunting"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
