# Configuração do Alembic para a plataforma phishing_intel.
# A URL do banco é resolvida dinamicamente em env.py a partir da
# configuração da aplicação (config.yaml / variáveis de ambiente).
[alembic]
script_location = database/migrations
prepend_sys_path = ..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
