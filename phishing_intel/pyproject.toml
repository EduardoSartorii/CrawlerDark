[project]
name = "phishing-intel"
version = "0.1.0"
description = "Plataforma profissional de Threat Intelligence para analise, classificacao, correlacao, enriquecimento e atribuicao de campanhas de phishing."
authors = [{ name = "CTI Engineering Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
packages = [
    { include = "collectors" },
    { include = "analyzers" },
    { include = "correlators" },
    { include = "enrichment" },
    { include = "database" },
    { include = "models" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic = "^2.9"
pydantic-settings = "^2.5"
SQLAlchemy = "^2.0"
alembic = "^1.13"
pymisp = "^2.4.196"
requests = "^2.32"
beautifulsoup4 = "^4.12"
lxml = "^5.3"
cryptography = "^43.0"
dnspython = "^2.6"
ipwhois = "^1.3"
PyYAML = "^6.0"
structlog = "^24.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
responses = "^0.25"
freezegun = "^1.5"
ruff = "^0.6"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = [
    "collectors",
    "analyzers",
    "correlators",
    "enrichment",
    "database",
    "models",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"
