[tool.poetry]
name = "phishing-intel"
version = "0.1.0"
description = "Professional phishing CTI platform for campaign attribution and MISP enrichment."
authors = ["CTI Engineering Team <cti@example.com>"]
readme = "README.md"
packages = [{ include = "phishing_intel" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.8.2"
sqlalchemy = "^2.0.35"
alembic = "^1.13.2"
pymisp = "^2.5.7.1"
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"
cryptography = "^43.0.1"
dnspython = "^2.7.0"
ipwhois = "^1.3.0"
pyyaml = "^6.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --cov=phishing_intel --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
