# ─────────────────────────────────────────────────────────────────────────────
# Platform global settings
# Environment variables override every value here.
# ─────────────────────────────────────────────────────────────────────────────

platform:
  name: "Threat Hunting Platform"
  version: "1.0.0"
  environment: development

database:
  url: "sqlite+aiosqlite:///./threat_hunting.db"
  pool_size: 10
  max_overflow: 20
  echo: false

redis:
  url: "redis://localhost:6379/0"
  max_connections: 50

# ─── OPSEC ───────────────────────────────────────────────────────────────────
opsec:
  default_profile: standard
  profiles:
    standard:
      proxy: null
      user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
      timeout: 30
      max_retries: 3
      backoff_factor: 2.0
      verify_ssl: true
      rate_limit_rps: 2.0
    darkweb:
      proxy: "socks5://127.0.0.1:9050"
      user_agent: "Mozilla/5.0 (Windows NT 10.0; rv:109.0) Gecko/20100101 Firefox/115.0"
      timeout: 60
      max_retries: 5
      backoff_factor: 3.0
      verify_ssl: false
      rate_limit_rps: 0.5
    aggressive:
      proxy: null
      user_agent: "Mozilla/5.0 (compatible; ThreatHunter/1.0)"
      timeout: 15
      max_retries: 2
      backoff_factor: 1.5
      verify_ssl: true
      rate_limit_rps: 5.0

# ─── Connectors ──────────────────────────────────────────────────────────────
connectors:
  enabled: []
  reddit:
    enabled: true
    opsec_profile: standard
    subreddits:
      - "netsec"
      - "hacking"
      - "cybersecurity"
      - "darknetmarkets"
    limit: 100
  github:
    enabled: true
    opsec_profile: standard
    search_queries: []
    max_pages: 5
  telegram:
    enabled: false
    opsec_profile: standard
    channels: []
  rss:
    enabled: true
    opsec_profile: standard
    feeds: []
  threatfox:
    enabled: true
    opsec_profile: standard
    days_back: 1
  alienvault:
    enabled: true
    opsec_profile: standard
    subscribed_pulses: true
  urlhaus:
    enabled: true
    opsec_profile: standard
  abuseipdb:
    enabled: false
    opsec_profile: standard
    confidence_minimum: 80
  virustotal:
    enabled: false
    opsec_profile: standard
  greynoise:
    enabled: false
    opsec_profile: standard
  misp:
    enabled: false
    opsec_profile: standard
    tags: ["osint", "threat-hunting"]

# ─── Detection Engine ─────────────────────────────────────────────────────────
detection:
  rules_path: "config/rules"
  enable_yara: true
  enable_regex: true
  enable_sigma: false
  enable_keyword: true
  enable_ioc: true
  whitelist_path: "config/whitelists"

# ─── Scoring Engine ───────────────────────────────────────────────────────────
scoring:
  weights:
    ioc_match: 2.5
    credential_match: 3.0
    card_match: 3.5
    cpf_match: 2.0
    cnpj_match: 1.5
    email_match: 1.0
    domain_match: 1.5
    yara_match: 2.0
    regex_match: 1.0
    vip_match: 3.0
    threat_actor_match: 2.5
    keyword_match: 1.0
    high_ioc_density: 1.5
    recurrence_bonus: 0.5
    source_reputation:
      darkweb: 1.5
      telegram: 1.2
      paste: 1.3
      social: 0.8
      feed: 0.5
  max_score: 10.0
  min_score: 0.0

# ─── Correlation Engine ───────────────────────────────────────────────────────
correlation:
  enabled: true
  min_similarity: 0.75
  time_window_hours: 72

# ─── Deduplication ────────────────────────────────────────────────────────────
deduplication:
  enabled: true
  strategy: hash_and_similarity
  similarity_threshold: 0.85
  ttl_hours: 168

# ─── Enrichment ───────────────────────────────────────────────────────────────
enrichment:
  enabled: true
  enrich_ips: true
  enrich_domains: true
  enrich_hashes: true

# ─── Exporters ────────────────────────────────────────────────────────────────
exporters:
  auto_export_threshold: 7.5
  misp:
    enabled: false
    url: ""
    key: ""
    verify_cert: false
    distribution: 1
    threat_level: 2
    analysis: 2
  splunk:
    enabled: false
    url: ""
    token: ""
    index: "threat_hunting"
  opensearch:
    enabled: false
    url: "http://localhost:9200"
    index: "threat-hunting"
  json:
    enabled: true
    output_path: "exports/json"
  csv:
    enabled: true
    output_path: "exports/csv"
  stix:
    enabled: false
    output_path: "exports/stix"
  webhook:
    enabled: false
    url: ""
    secret: ""

# ─── Scheduler ────────────────────────────────────────────────────────────────
scheduler:
  jobs:
    - id: reddit_collection
      connector: reddit
      cron: "0 */4 * * *"
      enabled: false
    - id: github_collection
      connector: github
      cron: "30 */2 * * *"
      enabled: false
    - id: threatfox_collection
      connector: threatfox
      cron: "0 * * * *"
      enabled: true
    - id: alienvault_collection
      connector: alienvault
      cron: "15 * * * *"
      enabled: true
    - id: urlhaus_collection
      connector: urlhaus
      cron: "0 */6 * * *"
      enabled: true

# ─── Observability ────────────────────────────────────────────────────────────
observability:
  prometheus:
    enabled: true
    port: 9090
  otlp:
    enabled: false
    endpoint: "http://localhost:4317"
  log_level: INFO
